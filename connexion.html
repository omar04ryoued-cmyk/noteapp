<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous ou créez votre compte NoteApp pour accéder à vos notes, tâches et flashcards.">
    <title>Connexion — NoteApp</title>
    <link rel="stylesheet" href="css/style.css?v=1785002001">
    <link rel="stylesheet" href="css/site.css?v=1785002001">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="site-page">

    <nav class="site-nav">
        <a href="index.html" class="site-nav-brand"><i class="fa-solid fa-book"></i> NoteApp</a>
        <div class="site-nav-links">
            <a href="index.html">Accueil</a>
            <a href="fonctionnalites.html">Fonctionnalités</a>
            <a href="equipe.html">Équipe</a>
        </div>
        <div class="site-nav-actions"></div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h1>Bienvenue</h1>
            <p class="auth-subtitle">Connectez-vous ou créez un compte pour accéder à vos notes.</p>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" type="button">Connexion</button>
                <button class="auth-tab" id="tab-register" type="button">Inscription</button>
            </div>

            <div class="auth-error" id="auth-error"></div>

            <!-- CONNEXION -->
            <form class="auth-form" id="form-login" novalidate>
                <div class="auth-field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required autocomplete="email">
                </div>
                <div class="auth-field">
                    <label for="login-password">Mot de passe</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="login-password" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" data-target="login-password" title="Afficher/masquer">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="primary-btn auth-submit">Se connecter</button>
            </form>

            <!-- INSCRIPTION -->
            <form class="auth-form hidden" id="form-register" novalidate>
                <div class="auth-field">
                    <label for="register-name">Nom complet</label>
                    <input type="text" id="register-name" required autocomplete="name">
                </div>
                <div class="auth-field">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required autocomplete="email">
                </div>
                <div class="auth-field">
                    <label for="register-password">Mot de passe</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="register-password" required minlength="4" autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" data-target="register-password" title="Afficher/masquer">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="password-strength">
                        <div class="password-strength-bar"><span id="password-strength-fill"></span></div>
                        <span id="password-strength-label"></span>
                    </div>
                </div>
                <button type="submit" class="primary-btn auth-submit">Créer mon compte</button>
            </form>

            <p class="auth-note">
                <i class="fa-solid fa-circle-info"></i>
                Vos données sont enregistrées uniquement dans ce navigateur.
                Le tout premier compte créé ici obtient automatiquement le rôle administrateur.
            </p>
        </div>
    </div>

    <script src="js/auth.js?v=1785002001"></script>
    <script src="js/nav.js?v=1785002001"></script>
    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const errorBox = document.getElementById('auth-error');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('visible');
        }

        function clearError() {
            errorBox.classList.remove('visible');
            errorBox.textContent = '';
        }

        function switchTab(mode) {
            clearError();
            const isRegister = mode === 'register';
            tabLogin.classList.toggle('active', !isRegister);
            tabRegister.classList.toggle('active', isRegister);
            formLogin.classList.toggle('hidden', isRegister);
            formRegister.classList.toggle('hidden', !isRegister);
        }

        tabLogin.addEventListener('click', () => switchTab('login'));
        tabRegister.addEventListener('click', () => switchTab('register'));

        // Ouvre directement sur l'onglet Inscription si ?mode=register
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'register') switchTab('register');

        // Si déjà connecté, on file directement vers l'app
        if (getCurrentUser()) {
            window.location.href = 'app.html';
        }

        /* --- Afficher / masquer le mot de passe --- */
        document.querySelectorAll('.btn-toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            });
        });

        /* --- Indicateur de force du mot de passe (inscription) --- */
        const strengthFill = document.getElementById('password-strength-fill');
        const strengthLabel = document.getElementById('password-strength-label');

        function evaluatePasswordStrength(password) {
            if (!password) return { score: 0, label: '', className: '' };

            let score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 10) score++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            if (score <= 1) return { score: 1, label: 'Faible', className: 'weak' };
            if (score <= 3) return { score: 2, label: 'Moyen', className: 'medium' };
            return { score: 3, label: 'Fort', className: 'strong' };
        }

        document.getElementById('register-password').addEventListener('input', (e) => {
            const result = evaluatePasswordStrength(e.target.value);
            strengthFill.className = result.className;
            strengthLabel.textContent = result.label;
            strengthLabel.className = result.className;
        });

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
        }

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email.trim() || !password) {
                showError("Veuillez remplir l'email et le mot de passe.");
                return;
            }
            if (!isValidEmail(email)) {
                showError("Veuillez entrer une adresse email valide.");
                return;
            }

            try {
                await loginUser(email, password);
                window.location.href = 'app.html';
            } catch (err) {
                showError(err.message);
            }
        });

        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            if (!name.trim() || !email.trim() || !password) {
                showError('Veuillez remplir tous les champs.');
                return;
            }
            if (!isValidEmail(email)) {
                showError("Veuillez entrer une adresse email valide.");
                return;
            }
            if (password.length < 4) {
                showError('Le mot de passe doit contenir au moins 4 caractères.');
                return;
            }

            try {
                await registerUser({ name, email, password });
                window.location.href = 'app.html';
            } catch (err) {
                showError(err.message);
            }
        });
    </script>
</body>
</html>
